[project]
name = "miot_kit"
version = "0.1.12"
description = "MIoT Kit"
authors = [{ name = "MIoT Development Team" }]
requires-python = ">=3.12"
dependencies = [
    "aiocache>=0.12",
    "aiofiles>=24.1",
    "asyncio>=4.0.0",
    "aiohttp>=3.12.14",
    "psutil>=7.0.0",
    "pydantic>=2.4.0",
    "fastmcp>=2.11",
    "zeroconf>=0.147",
    "av>=15.0",
    "pillow>=10.3.0",
    "toml>=0.10.2",
]

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "miot"
module-root = ""
